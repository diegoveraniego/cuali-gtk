app-id: org.cuali.CualiGTK
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: cuali-gtk
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host

modules:
  - name: cuali-gtk
    buildsystem: simple
    build-commands:
      - make
      - make install PREFIX=/app
    sources:
      - type: dir
        path: .
