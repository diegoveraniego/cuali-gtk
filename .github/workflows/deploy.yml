name: Build Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y libgtk-4-dev libadwaita-1-dev libsqlite3-dev libpoppler-glib-dev

    - name: Build binary
      run: make

    - name: Build AppImage
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk-x86_64.sh
        chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk-x86_64.sh
        
        mkdir -p AppDir/usr/bin
        cp cuali-gtk AppDir/usr/bin/
        
        # Setup icon and desktop file
        mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
        cp icons/hicolor/scalable/apps/org.cuali.CualiGTK.svg AppDir/usr/share/icons/hicolor/scalable/apps/
        mkdir -p AppDir/usr/share/applications
        cp org.cuali.CualiGTK.desktop AppDir/usr/share/applications/
        
        export DEPLOY_GTK_VERSION=4
        # Use the plugin by placing it in the current directory and giving it the expected name
        mv linuxdeploy-plugin-gtk-x86_64.sh linuxdeploy-plugin-gtk.sh
        
        # Extract linuxdeploy AppImage to run it without FUSE requirements
        ./linuxdeploy-x86_64.AppImage --appimage-extract
        
        PATH=".:$PATH" ./squashfs-root/AppRun --appdir AppDir \
          --desktop-file AppDir/usr/share/applications/org.cuali.CualiGTK.desktop \
          --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/org.cuali.CualiGTK.svg \
          --plugin gtk --output appimage
        
        # Rename for artifact
        mv Cuali*.AppImage Cuali-x86_64.AppImage

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cuali-Linux-AppImage
        path: Cuali-x86_64.AppImage

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: brew install gtk4 libadwaita sqlite poppler pkg-config

    - name: Build project
      run: make -j$(sysctl -n hw.ncpu)
      env:
        PKG_CONFIG_PATH: "/opt/homebrew/opt/poppler/lib/pkgconfig:/opt/homebrew/opt/sqlite/lib/pkgconfig"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cuali-macOS
        path: cuali-gtk

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-gtk4
          mingw-w64-ucrt-x86_64-libadwaita
          mingw-w64-ucrt-x86_64-sqlite3
          mingw-w64-ucrt-x86_64-poppler
          make

    - name: Build project
      shell: msys2 {0}
      run: make -j$NUMBER_OF_PROCESSORS

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cuali-Windows
        path: cuali-gtk.exe
